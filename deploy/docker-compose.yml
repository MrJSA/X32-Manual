# Standalone Docker Compose deployment
# Usage:
#   docker compose up -d
services:
  manual:
    image: ghcr.io/mrjsa/x32-manual:latest
    container_name: x32-manual
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
